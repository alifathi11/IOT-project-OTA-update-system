<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Devices | OTA Panel</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header>
      <h1>OTA Management</h1>
      <nav>
        <a class="active" href="index.html">Devices</a>
        <a href="firmwares.html">Firmware</a>
        <a href="updates.html">Update</a>
        <a href="history.html">History</a>
      </nav>
      <span id="server-state" class="server-state">checking…</span>
    </header>

    <main>
      <div class="card">
        <h2>Registered devices</h2>
        <p class="hint">
          Live data from <code>GET /api/devices</code>, refreshed every 10 seconds.
        </p>
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Device UID</th>
              <th>Version</th>
              <th>Mode</th>
              <th>Last status</th>
              <th>Last seen</th>
            </tr>
          </thead>
          <tbody id="devices-body">
            <tr><td class="empty" colspan="6">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </main>

    <div id="toast" class="toast"></div>
    <script src="js/api.js"></script>
    <script src="js/devices.js"></script>
  </body>
</html>
